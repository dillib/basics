services:
  # Web Service (Main Application)
  - type: web
    name: basicstutor
    runtime: node
    plan: starter # Change to 'standard' for production
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/topics
    envVars:
      # Node Environment
      - key: NODE_ENV
        value: production

      # Database - Use Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: basicstutor-db
          property: connectionString

      # Session Secret - Generate a random value
      - key: SESSION_SECRET
        generateValue: true

      # Admin Emails - Set your admin emails
      - key: ADMIN_EMAILS
        sync: false

      # Google OAuth - Set in Render Dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Stripe - Set in Render Dashboard
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # AI Integration - Set in Render Dashboard
      - key: GOOGLE_API_KEY
        sync: false

      # Abuse / cost protection (optional - defaults are sensible)
      - key: AI_RATE_LIMIT_PER_HOUR
        value: "20"
      - key: QUICK_SEARCH_RATE_LIMIT_PER_MIN
        value: "15"

  # Cron Job: refreshes the homepage "Trending Now" section from real daily
  # search trends once a day. See server/refresh-trending-topics.ts. Uses a
  # lightweight build (no client/server bundling needed, it only runs a tsx
  # script) and shares the same database as the web service.
  - type: cron
    name: refresh-trending-topics
    runtime: node
    plan: starter
    schedule: "0 9 * * *" # 9am UTC daily
    buildCommand: npm install --include=dev
    startCommand: npm run refresh:trending
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: basicstutor-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false

# PostgreSQL Database (the only datastore this app needs)
databases:
  - name: basicstutor-db
    databaseName: basicstutor
    # Render Postgres plan (the legacy 'starter' name is no longer accepted).
    # 'basic-256mb' is the smallest paid tier (needs a payment method on file).
    # Use 'free' to test without a card (note: free DBs expire after 30 days).
    # Scale up later with 'basic-1gb', 'basic-4gb', 'pro-4gb', etc.
    plan: basic-256mb
    postgresMajorVersion: 16
