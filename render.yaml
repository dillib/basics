services:
  # Web Service (Main Application)
  - type: web
    name: basicstutor
    runtime: node
    plan: starter # Change to 'standard' for production
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/topics
    # Custom domain (basicstutor.com). Also add it under Settings > Custom
    # Domains in the Render dashboard if a Blueprint sync doesn't pick this
    # up automatically -- that's also where Render shows the DNS records to
    # add at your registrar (A record for the apex, CNAME for www).
    domains:
      - basicstutor.com
      - www.basicstutor.com
    envVars:
      # Node Environment
      - key: NODE_ENV
        value: production

      # Canonical public URL -- used for SEO (canonical links, sitemap,
      # Open Graph tags). Without this the app falls back to deriving the
      # host from each incoming request, which works but can mix
      # basicstutor.com and the onrender.com fallback across pages.
      - key: PUBLIC_URL
        value: https://www.basicstutor.com

      # Database - Use Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: basicstutor-db
          property: connectionString

      # Session Secret - Generate a random value
      - key: SESSION_SECRET
        generateValue: true

      # Admin Emails - Set your admin emails
      - key: ADMIN_EMAILS
        sync: false

      # Google OAuth - Set in Render Dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Stripe - Set in Render Dashboard
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # AI Integration - Set in Render Dashboard
      - key: GOOGLE_API_KEY
        sync: false

      # Abuse / cost protection (optional - defaults are sensible)
      - key: AI_RATE_LIMIT_PER_HOUR
        value: "20"
      - key: QUICK_SEARCH_RATE_LIMIT_PER_MIN
        value: "15"

  # Cron Job: refreshes the homepage "Trending Now" section from real daily
  # search trends once a day. See server/refresh-trending-topics.ts. Uses a
  # lightweight build (no client/server bundling needed, it only runs a tsx
  # script) and shares the same database as the web service.
  - type: cron
    name: refresh-trending-topics
    runtime: node
    plan: starter
    schedule: "0 9 * * *" # 9am UTC daily
    buildCommand: npm install --include=dev
    startCommand: npm run refresh:trending
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: basicstutor-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false

  # Cron Jobs: email a traction summary (new users, new topics with titles,
  # waitlist total) on three cadences. See server/send-report.ts -- one
  # script, a "daily"/"weekly"/"monthly" arg picks the lookback window.
  # All three share the same RESEND_API_KEY / REPORT_EMAIL.
  - type: cron
    name: daily-report
    runtime: node
    plan: starter
    schedule: "0 13 * * *" # 1pm UTC daily = ~9am Eastern / 6am Pacific
    buildCommand: npm install --include=dev
    startCommand: npm run report:daily
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: basicstutor-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: REPORT_EMAIL
        value: dillib@gmail.com

  - type: cron
    name: weekly-report
    runtime: node
    plan: starter
    schedule: "0 13 * * 1" # 1pm UTC every Monday
    buildCommand: npm install --include=dev
    startCommand: npm run report:weekly
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: basicstutor-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: REPORT_EMAIL
        value: dillib@gmail.com

  - type: cron
    name: monthly-report
    runtime: node
    plan: starter
    schedule: "0 13 1 * *" # 1pm UTC on the 1st of each month
    buildCommand: npm install --include=dev
    startCommand: npm run report:monthly
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: basicstutor-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: REPORT_EMAIL
        value: dillib@gmail.com

  # Cron Job: emails users with due reviews a "come back and review" nudge.
  # OFF until REVIEW_REMINDERS_ENABLED=true is set here AND a real sending
  # domain is verified in Resend (RESEND_FROM_EMAIL) -- see
  # server/send-review-reminders.ts. Weekly so it never feels spammy.
  - type: cron
    name: review-reminders
    runtime: node
    plan: starter
    schedule: "0 14 * * 1" # 1pm ET Monday
    buildCommand: npm install --include=dev
    startCommand: npm run remind:reviews
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: basicstutor-db
          property: connectionString
      - key: PUBLIC_URL
        value: https://www.basicstutor.com
      - key: SESSION_SECRET
        fromService:
          type: web
          name: basicstutor
          envVarKey: SESSION_SECRET
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: REVIEW_REMINDERS_ENABLED
        value: "false"

# PostgreSQL Database (the only datastore this app needs)
databases:
  - name: basicstutor-db
    databaseName: basicstutor
    # Render Postgres plan (the legacy 'starter' name is no longer accepted).
    # 'basic-256mb' is the smallest paid tier (needs a payment method on file).
    # Use 'free' to test without a card (note: free DBs expire after 30 days).
    # Scale up later with 'basic-1gb', 'basic-4gb', 'pro-4gb', etc.
    plan: basic-256mb
    postgresMajorVersion: 16
